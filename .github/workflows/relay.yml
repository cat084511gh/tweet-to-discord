name: tweet-to-discord

on:
  schedule:
    - cron: "*/30 * * * *"   # 予備（GitHubの定期実行は数時間遅れることがある）
  workflow_dispatch:          # cron-job.org から5分ごとに起動される

permissions:
  contents: write

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # 待たされた実行でも最新の state.json を使う（二重投稿防止）
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Relay tweets
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python relay.py
      - name: Save state
        if: always()   # 投稿が途中で失敗しても、投稿済みの分は記録する
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
